name: 01 - Building Blocks
on: [ push, workflow_dispatch ]

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    outputs:
      harish: ${{steps.sreeja.outputs.pp_s}}
    steps:
      - name: Say hello
        id: sreeja
        run: echo "pp_s=helloworld"
      - name: to list file
        run: ls -l
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo "i am"
          echo "a multi-line"
          echo "script."
      - name: Say goodbye
        run:  echo "Goodbye!"




  

      
